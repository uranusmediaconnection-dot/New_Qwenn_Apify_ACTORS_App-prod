name: Deploy Actors to Apify

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each actor lives in its own top-level folder
        actor: [google-maps-leads-searcher, linkedin-leads-collector, email-extractor]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Apify CLI
        run: npm install -g apify-cli
      - name: Authenticate Apify CLI
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: apify login --token "$APIFY_TOKEN"
      - name: Deploy Actor
        # -f: repo is the source of truth in CI (push even if platform copy looks newer)
        run: apify push -f
        working-directory: ${{ matrix.actor }}
